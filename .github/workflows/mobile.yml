name: Mobile app (Flutter)

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate android/ios folders
        run: bash setup_platforms.sh

      # Real values come from repository secrets when set; placeholders let the
      # build compile for checking even before secrets exist.
      - name: Write env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "${SUPABASE_URL:-https://placeholder.supabase.co}",
            "SUPABASE_ANON_KEY": "${SUPABASE_ANON_KEY:-placeholder}",
            "API_BASE_URL": "${API_BASE_URL:-https://example.com}"
          }
          EOF

      - name: Analyze (errors fail the build, warnings don't)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: harshwardhan-ayurveda-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
