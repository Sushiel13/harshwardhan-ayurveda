name: Mobile app (Flutter)

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate android/ios folders
        run: bash setup_platforms.sh

      # Real values come from repository secrets when set; placeholders let the
      # build compile for checking even before secrets exist.
      - name: Write env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "${SUPABASE_URL:-https://placeholder.supabase.co}",
            "SUPABASE_ANON_KEY": "${SUPABASE_ANON_KEY:-placeholder}",
            "API_BASE_URL": "${API_BASE_URL:-https://example.com}"
          }
          EOF

      - name: Analyze (errors fail the build, warnings don't)
        run: |
          set +e
          dart analyze --format=machine lib > analyze.txt 2>&1
          code=$?
          # Surface each error as a GitHub annotation on the file/line
          grep '^ERROR|' analyze.txt | head -50 | while IFS='|' read -r sev typ rule file line col len msg; do
            rel="mobile/${file#*/mobile/}"
            echo "::error file=${rel},line=${line},col=${col}::[${rule}] ${msg}"
          done
          echo "Errors: $(grep -c '^ERROR|' analyze.txt)  Warnings: $(grep -c '^WARNING|' analyze.txt)"
          if grep -q '^ERROR|' analyze.txt; then exit 1; fi
          exit 0

      - name: Build APK
        run: |
          set +e
          flutter build apk --release --dart-define-from-file=env.json 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # Put the important part of the Gradle/Flutter error into one annotation
            msg=$(grep -E -A12 "What went wrong|error:|Error:|FAILURE|Exception" build.log | head -120)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
            echo "::error title=APK build failed::${msg}"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: harshwardhan-ayurveda-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
